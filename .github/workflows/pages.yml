name: Publish static registry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned trusted Tarn toolchain
        run: tools/bootstrap.sh
      - name: Validate registry and generate catalog with Tarn
        env:
          BASE: ${{ github.event.before }}
          TARN: ${{ github.workspace }}/build/compiler/target/release/tarn
        run: |
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then export BASE=; fi
          tools/test.sh
          cp build/catalog.json site/catalog.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
