name: Validate registry
on: [pull_request, push]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned trusted Tarn toolchain
        run: tools/bootstrap.sh
      - name: Validate and generate using Tarn
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARN: ${{ github.workspace }}/build/compiler/target/release/tarn
        run: |
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then export BASE=; fi
          tools/test.sh
